<main class="grid min-h-dvh place-items-center bg-background px-4 py-10">
  <section
    class="w-full max-w-[420px] rounded-2xl border border-border bg-card px-6 py-8 shadow-sm sm:px-9 sm:py-9"
  >
    <div class="flex items-center gap-2.5 pb-7">
      <app-brand-mark class="h-10" />
      <span class="font-display text-2xl font-extrabold tracking-tight">
        <span class="text-brand-ink">Mouse</span><span class="text-primary">Dent</span>
      </span>
    </div>

    <p class="text-xs font-extrabold tracking-[0.14em] text-muted-foreground uppercase">
      Panel de administración
    </p>
    <h1 class="mt-3 font-display text-3xl font-extrabold tracking-tight">Volvamos a tu clínica</h1>
    <p class="mt-2 text-sm text-muted-foreground">
      Inicia sesión para gestionar los locales de MouseDent.
    </p>

    @if (endNotice(); as notice) {
      <p
        class="mt-5 rounded-lg border border-brand-peach bg-brand-peach-soft px-3 py-2.5 text-sm text-accent-foreground"
        role="status"
      >
        {{ notice }}
      </p>
    }

    @if (error(); as message) {
      <p
        class="mt-5 rounded-lg border border-destructive/40 bg-destructive/10 px-3 py-2.5 text-sm text-destructive"
        role="alert"
      >
        {{ message }}
      </p>
    }

    <form class="mt-6 space-y-5" (submit)="submit($event)" novalidate>
      <div>
        <label class="mb-2 block text-sm font-bold" for="email">Correo electrónico</label>
        <input
          class="h-12 w-full rounded-lg border border-input bg-card px-3 text-base text-foreground outline-none placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-2 focus-visible:ring-ring/40"
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          autofocus
          required
          [value]="email()"
          (input)="onEmailInput($event)"
        />
      </div>

      <div>
        <label class="mb-2 block text-sm font-bold" for="password">Contraseña</label>
        <input
          class="h-12 w-full rounded-lg border border-input bg-card px-3 text-base text-foreground outline-none placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-2 focus-visible:ring-ring/40"
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          [value]="password()"
          (input)="onPasswordInput($event)"
        />
      </div>

      <button
        class="inline-flex h-12 w-full items-center justify-center rounded-xl bg-primary text-sm font-bold text-primary-foreground transition-colors hover:bg-primary/90 focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background focus-visible:outline-none disabled:cursor-progress disabled:opacity-70"
        type="submit"
        [disabled]="submitting()"
      >
        {{ submitting() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </section>
</main>
