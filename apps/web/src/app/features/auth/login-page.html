<app-public-shell
  title="Un buen día empieza con tu equipo."
  subtitle="Un espacio para cada persona, con el acceso que necesita."
>
  <p class="text-xs font-extrabold tracking-[0.14em] text-muted-foreground uppercase">
    Acceso del personal
  </p>
  <h1 class="mt-3 font-display text-3xl font-extrabold tracking-tight">Qué bueno verte de nuevo</h1>
  <p class="mt-2 text-sm text-muted-foreground">Ingresa con tu cuenta de MouseDent.</p>

  @if (endNotice(); as notice) {
    <p
      class="mt-5 rounded-lg border border-brand-peach bg-brand-peach-soft px-3 py-2.5 text-sm text-accent-foreground"
      role="status"
    >
      {{ notice }}
    </p>
  }

  @if (error(); as message) {
    <p
      class="mt-5 rounded-lg border border-destructive/40 bg-destructive/10 px-3 py-2.5 text-sm text-destructive"
      role="alert"
    >
      {{ message }}
    </p>
  }

  <form class="mt-6 space-y-5" (submit)="submit($event)" novalidate>
    <div>
      <label class="mb-2 block text-sm font-bold" for="email">Correo electrónico</label>
      <input
        class="h-12 w-full rounded-lg border border-input bg-card px-3 text-base text-foreground outline-none placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-2 focus-visible:ring-ring/40"
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        placeholder="nombre@correo.com"
        autofocus
        required
        [value]="email()"
        (input)="onEmailInput($event)"
      />
    </div>

    <div>
      <label class="mb-2 block text-sm font-bold" for="password">Contraseña</label>
      <div class="relative">
        <input
          class="h-12 w-full rounded-lg border border-input bg-card pr-12 pl-3 text-base text-foreground outline-none placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-2 focus-visible:ring-ring/40"
          id="password"
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="current-password"
          required
          [value]="password()"
          (input)="onPasswordInput($event)"
        />
        <button
          class="absolute top-1/2 right-1 grid size-10 -translate-y-1/2 place-items-center rounded-lg text-muted-foreground hover:bg-muted focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
          type="button"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [attr.aria-pressed]="showPassword()"
          (click)="togglePassword()"
        >
          <svg
            class="size-5"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12 M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"
            />
          </svg>
        </button>
      </div>
    </div>

    <a
      class="inline-block text-sm font-semibold text-primary underline-offset-4 hover:underline focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
      routerLink="/recuperar-acceso"
      >Olvidé mi contraseña</a
    >

    <button
      class="inline-flex h-12 w-full items-center justify-center rounded-xl bg-primary text-sm font-bold text-primary-foreground transition-colors hover:bg-primary/90 focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background focus-visible:outline-none disabled:cursor-progress disabled:opacity-70"
      type="submit"
      [disabled]="submitting()"
    >
      {{ submitting() ? 'Entrando…' : 'Iniciar sesión' }}
    </button>
  </form>

  <p class="mt-6 text-center text-xs text-muted-foreground">
    ¿Todavía no tienes una cuenta? Contacta a administración para recibir tu invitación.
  </p>
</app-public-shell>
