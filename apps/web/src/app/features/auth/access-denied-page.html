<main class="grid min-h-dvh place-items-center bg-background px-4 py-10">
  <section
    class="w-full max-w-[460px] rounded-2xl border border-border bg-card px-6 py-8 text-center shadow-sm sm:px-9 sm:py-9"
  >
    <div class="flex items-center justify-center gap-2.5 pb-6">
      <app-brand-mark class="h-9" />
      <span class="font-display text-xl font-extrabold tracking-tight">
        <span class="text-brand-ink">Mouse</span><span class="text-primary">Dent</span>
      </span>
    </div>

    <p class="text-xs font-extrabold tracking-[0.14em] text-muted-foreground uppercase">
      Acceso restringido
    </p>
    <h1 class="mt-3 font-display text-2xl font-extrabold tracking-tight">
      No puedes gestionar locales
    </h1>
    <p class="mt-3 text-sm text-muted-foreground">
      Solo un administrador autenticado puede consultar o gestionar los locales y sus fotos.
    </p>

    @if (account(); as user) {
      <p class="mt-4 text-sm font-semibold">Sesión de {{ user.email }}</p>
    }

    <button
      class="mt-7 inline-flex h-11 w-full items-center justify-center rounded-xl bg-primary text-sm font-bold text-primary-foreground transition-colors hover:bg-primary/90 focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background focus-visible:outline-none"
      type="button"
      (click)="signOut()"
    >
      Cerrar sesión
    </button>
  </section>
</main>
